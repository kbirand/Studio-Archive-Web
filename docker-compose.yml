version: '3.8'

services:
  works-interface:
    build: .
    container_name: works-interface
    restart: unless-stopped
    # "host" mode lets the container share the NAS network stack. 
    # This allows "127.0.0.1" to refer to the NAS itself.
    network_mode: "host"
    # ports:  <-- Ports are ignored in host mode (app binds directly to NAS port 3002)
    #   - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - PHOTO_ARCHIVE_PATH=/data/PhotoArchive
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_key_change_me}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      # Database Configuration
      # CRITICAL: DB_HOST must be your NAS LAN IP (e.g. 192.168.1.50)
      # DO NOT use 127.0.0.1 or localhost - that refers to the container itself!
      - DB_HOST=${DB_HOST:-192.168.1.XXX}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-kB12711271!}
      - DB_NAME=${DB_NAME:-studioarchive}
      - DB_PORT=3306
    volumes:
      # Mount your photo archive - read-write for uploads and database
      # Local - /volume1/PhotoArchive:/data/PhotoArchive:rw
      # NAS - /volume1/Works/00_PhotoArchive:/data/PhotoArchive:rw
      # Mount your photo archive
      - /volume1/Works/00_PhotoArchive:/data/PhotoArchive:rw
      # DEVELOPMENT MOUNT: Force container to use the code on the disk
      - ./server:/app/server
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3002/api/works" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
